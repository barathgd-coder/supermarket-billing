<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">
  <title th:text="${title + ' | ' + (store?.name ?: 'Supermarket')}">Supermarket</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<aside class="sidebar" th:fragment="sidebar(active)" id="sidebar">
  <div class="brand">
    <img th:src="@{/logo(v=${store.logoVersion})}" alt="logo">
    <span th:text="${store.name}">Store</span>
  </div>
  <nav class="nav flex-column">
    <a sec:authorize="hasRole('ADMIN')" class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="nav-group">Counter</div>
    <a class="nav-link" th:classappend="${active == 'billing'} ? 'active'" th:href="@{/billing}"><i class="bi bi-upc-scan"></i> Billing</a>
    <a class="nav-link" th:classappend="${active == 'sales'} ? 'active'" th:href="@{/sales}"><i class="bi bi-receipt"></i> Sales history</a>
    <a class="nav-link" th:classappend="${active == 'customers'} ? 'active'" th:href="@{/customers}"><i class="bi bi-people"></i> Customers</a>
    <th:block sec:authorize="hasRole('ADMIN')">
      <div class="nav-group">Stock</div>
      <a class="nav-link" th:classappend="${active == 'products'} ? 'active'" th:href="@{/products}"><i class="bi bi-box-seam"></i> Products</a>
      <a class="nav-link" th:classappend="${active == 'inventory'} ? 'active'" th:href="@{/inventory}"><i class="bi bi-boxes"></i> Inventory</a>
      <a class="nav-link" th:classappend="${active == 'suppliers'} ? 'active'" th:href="@{/suppliers}"><i class="bi bi-truck"></i> Suppliers</a>
      <div class="nav-group">Store</div>
      <a class="nav-link" th:classappend="${active == 'reports'} ? 'active'" th:href="@{/reports}"><i class="bi bi-bar-chart-line"></i> Reports</a>
      <a class="nav-link" th:classappend="${active == 'settings'} ? 'active'" th:href="@{/settings}"><i class="bi bi-gear"></i> Settings</a>
      <a class="nav-link" th:classappend="${active == 'users'} ? 'active'" th:href="@{/settings/users}"><i class="bi bi-person-gear"></i> Users</a>
    </th:block>
  </nav>
</aside>

<header class="topbar" th:fragment="topbar(title)">
  <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
  <h1 class="h5 mb-0" th:text="${title}">Title</h1>
  <div class="ms-auto d-flex align-items-center gap-2">
    <button class="btn btn-outline-secondary btn-sm" id="themeToggle" type="button" title="Light / dark mode"><i class="bi bi-moon-stars"></i></button>
    <span class="user-chip d-none d-md-inline-flex"><i class="bi bi-person-circle"></i> <span sec:authentication="name">user</span></span>
    <form th:action="@{/logout}" method="post" class="m-0"><button class="btn btn-outline-danger btn-sm" type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button></form>
  </div>
</header>

<div th:fragment="scripts">
  <div id="flash" th:attr="data-success=${success}, data-error=${error}"></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toasts"></div>
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Please confirm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="confirmText">Are you sure?</div>
      <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" id="confirmOk">Yes, continue</button></div>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <div class="modal fade" id="scanModal" tabindex="-1" aria-labelledby="scanTitle">
    <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="scanTitle">Scan a code</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div th:replace="~{fragments/layout :: scanPanel}"></div>
    </div></div>
  </div>
  <script th:src="@{/js/vendor/zxing.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
  <script th:src="@{/js/scanner.js}"></script>
</div>

<div th:fragment="scanPanel" class="scan-panel">
  <div class="scan-view"><video class="sc-video" playsinline muted></video><div class="scan-frame"><div></div></div><div class="sc-flash"></div></div>
  <div class="scan-tools">
    <select class="form-select form-select-sm sc-device" aria-label="Camera"><option>Looking for cameras...</option></select>
    <button type="button" class="btn btn-sm sc-refresh" title="Refresh cameras" aria-label="Refresh cameras"><i class="bi bi-arrow-clockwise"></i></button>
  </div>
  <div class="scan-msg sc-msg" role="status" aria-live="polite"></div>
</div>

<nav th:fragment="pagination(page)" th:if="${page.totalPages > 1}">
  <ul class="pagination pagination-sm justify-content-end mb-0">
    <li class="page-item" th:classappend="${page.first} ? 'disabled'"><a class="page-link" th:href="${'?' + baseQuery + 'page=' + (page.number - 1)}">&laquo;</a></li>
    <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:if="${i == 0 or i == page.totalPages - 1 or (i - page.number) * (i - page.number) <= 4}" th:classappend="${i == page.number} ? 'active'">
      <a class="page-link" th:href="${'?' + baseQuery + 'page=' + i}" th:text="${i + 1}">1</a></li>
    <li class="page-item" th:classappend="${page.last} ? 'disabled'"><a class="page-link" th:href="${'?' + baseQuery + 'page=' + (page.number + 1)}">&raquo;</a></li>
  </ul>
</nav>
</body>
</html>
