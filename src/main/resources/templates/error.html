<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div class="login-wrap p-3"><div class="card login-card"><div class="card-body text-center p-4">
  <i class="bi bi-exclamation-triangle display-4 text-warning"></i>
  <h1 class="h4 mt-2">Error <span th:text="${status}">500</span></h1>
  <p class="text-muted" th:text="${message ?: 'Something went wrong.'}">Message</p>
  <a class="btn btn-primary" th:href="@{/}">Back to home</a>
</div></div></div>
</body>
</html>
