<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Supplier')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('suppliers')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/layout :: topbar('Supplier')}"></header>
<main class="app-content">
<div class="card mb-3"><div class="card-body"><h2 class="h5" th:text="${supplier.name}">Name</h2>
  <div class="text-muted"><span th:text="${supplier.contactNumber}"></span> &nbsp; <span th:text="${supplier.email}"></span></div><div class="text-muted" th:text="${supplier.address}"></div></div></div>
<div class="row g-3">
  <div class="col-lg-5"><div class="card"><div class="card-header">Products supplied <span class="badge text-bg-primary" th:text="${#lists.size(products)}">0</span></div>
    <ul class="list-group list-group-flush overflow-auto" style="max-height:420px"><li class="list-group-item d-flex justify-content-between" th:each="p : ${products}"><span th:text="${p.name}"></span><span class="text-muted" th:text="${'Stock ' + p.quantity}"></span></li>
      <li class="list-group-item text-muted" th:if="${#lists.isEmpty(products)}">No products</li></ul></div></div>
  <div class="col-lg-7"><div class="card"><div class="card-header">Purchase history (stock-in)</div><div class="table-responsive" style="max-height:420px"><table class="table table-sm mb-0">
    <thead><tr><th>Date</th><th>Product</th><th class="text-end">Qty</th><th>Reference</th></tr></thead>
    <tbody><tr th:each="t : ${history}"><td th:text="${#temporals.format(t.createdAt, 'dd MMM yyyy')}"></td><td th:text="${t.product.name}"></td><td class="text-end" th:text="${t.quantityChange}"></td><td th:text="${t.reference}"></td></tr>
    <tr th:if="${#lists.isEmpty(history)}"><td colspan="4" class="text-center text-muted py-3">No purchases recorded</td></tr></tbody></table></div></div></div>
</div>
<a class="btn btn-light mt-3" th:href="@{/suppliers}">&laquo; Back</a>
</main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
