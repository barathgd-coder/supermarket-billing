<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Suppliers')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('suppliers')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/layout :: topbar('Suppliers')}"></header>
<main class="app-content">
<div class="row g-3">
  <div class="col-lg-8"><div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
    <thead><tr><th>Name</th><th>Contact</th><th>Email</th><th></th></tr></thead>
    <tbody><tr th:each="s : ${suppliers}"><td th:text="${s.name}"></td><td th:text="${s.contactNumber}"></td><td th:text="${s.email}"></td>
      <td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/suppliers/{id}(id=${s.id})}">Details</a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/suppliers(edit=${s.id})}"><i class="bi bi-pencil"></i></a>
        <form class="d-inline" method="post" th:action="@{/suppliers/{id}/delete(id=${s.id})}" th:attr="data-confirm='Delete supplier ' + ${s.name} + '?'"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form></td></tr>
    <tr th:if="${#lists.isEmpty(suppliers)}"><td colspan="4" class="text-center text-muted py-4">No suppliers</td></tr></tbody></table></div></div></div>
  <div class="col-lg-4"><div class="card"><div class="card-header" th:text="${form.id == null} ? 'Add supplier' : 'Edit supplier'">Supplier</div><div class="card-body">
    <form th:action="@{/suppliers/save}" th:object="${form}" method="post" class="needs-validation" novalidate>
      <input type="hidden" th:field="*{id}">
      <div class="mb-2"><label class="form-label small mb-0">Name *</label><input class="form-control" th:field="*{name}" th:errorclass="is-invalid" maxlength="120" required><div class="invalid-feedback" th:errors="*{name}">Required</div></div>
      <div class="mb-2"><label class="form-label small mb-0">Contact number</label><input class="form-control" th:field="*{contactNumber}" th:errorclass="is-invalid" pattern="[0-9+\- ]{7,15}"><div class="invalid-feedback" th:errors="*{contactNumber}">Invalid</div></div>
      <div class="mb-2"><label class="form-label small mb-0">Email</label><input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{email}">Invalid</div></div>
      <div class="mb-3"><label class="form-label small mb-0">Address</label><input class="form-control" th:field="*{address}" maxlength="255"></div>
      <button class="btn btn-primary">Save</button> <a class="btn btn-light" th:href="@{/suppliers}" th:if="${form.id != null}">Cancel</a>
    </form></div></div></div>
</div>
</main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
