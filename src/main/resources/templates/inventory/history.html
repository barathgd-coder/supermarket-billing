<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Inventory history')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('inventory')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/layout :: topbar('Inventory history')}"></header>
<main class="app-content">
<div class="card mb-2"><div class="card-body py-2"><form method="get" class="row g-2">
  <div class="col-md-6"><input name="q" th:value="${q}" class="form-control" placeholder="Search by product name or barcode"></div>
  <div class="col-md-6 d-flex gap-2"><button class="btn btn-primary">Search</button><a class="btn btn-light" th:href="@{/inventory}">Back to stock</a></div></form></div></div>
<div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
  <thead><tr><th>Date</th><th>Product</th><th>Type</th><th class="text-end">Change</th><th class="text-end">Balance</th><th>Reference</th><th>By</th></tr></thead>
  <tbody><tr th:each="t : ${page.content}">
    <td th:text="${#temporals.format(t.createdAt, 'dd MMM yyyy HH:mm')}"></td>
    <td th:text="${t.product.name}"></td>
    <td><span class="badge" th:classappend="${t.quantityChange > 0} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${t.type}"></span></td>
    <td class="text-end" th:classappend="${t.quantityChange > 0} ? 'text-success' : 'text-danger'" th:text="${(t.quantityChange > 0 ? '+' : '') + t.quantityChange}"></td>
    <td class="text-end" th:text="${t.balanceAfter}"></td><td th:text="${t.reference}"></td><td th:text="${t.createdBy}"></td></tr>
  <tr th:if="${page.empty}"><td colspan="7" class="text-center text-muted py-4">No transactions</td></tr></tbody></table></div>
  <div class="card-footer" th:replace="~{fragments/layout :: pagination(${page})}"></div></div>
</main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
