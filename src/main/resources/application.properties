spring.application.name=supermarket
server.port=${PORT:8080}
# Behind Render's HTTPS proxy: keep correct scheme/host in redirects
server.forward-headers-strategy=framework

# Default profile = h2 (zero setup, file based). Use APP_PROFILE=mysql for MySQL.
spring.profiles.active=${APP_PROFILE:h2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always

app.upload-dir=./uploads
